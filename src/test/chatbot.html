<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body {
        font-family: Arial;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .send-button {
        background-color: rgb(25, 135, 84);
        color: white;
        padding: 12px 20px;
        margin-left: 10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }

      .chat-input {
        padding: 12px 15px;
        border-radius: 10px;
        border-width: 1px;
        font-size: 15px;
        flex-grow: 1;
      }

      .chat-input-container {
        display: flex;
        margin-bottom: 60px;
      }
      .app-container {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .chat-message-user {
        display: flex;
        justify-content: end;
        align-items: start;
      }
      .chat-message-robot {
        display: flex;
        align-items: start;
      }
      .chat-message-text {
        background-color: rgb(238,238,238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        align-items: start;
        max-width: 300px;
      }
      .chat-message-profile {
        width: 45px;
      }
      .chat-messages-container {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>


    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script> 
    <script type="text/babel">

      const container = document.querySelector('.js-container');

      ReactDOM.createRoot(container).render(<App />);//Change the innerHTML for example 1 will be 2

      //Saving data and managing output
      function App() {
         const [chatMessages, setChatMessages] = React.useState([{ //chatMessages current array
          message: 'hello chatbot',
          sender: 'user',
          id: 'id1'
        }, {
          message: 'Hello! How can I help you?',
          sender: 'robot',
          id: 'id2'
        }, {
          message: 'can you get me todays date?',
          sender: 'user',
          id: 'id3'
        }, {
          message: 'Today is November 26',
          sender: 'robot',
          id: 'id4'
        }]);
        //const chatMessages = array[0]; //current data of array
        //const setChatMessages = array[1]; //updater function like array.push
        //const [chatMessages, setChatMessages] = array;

        return(
            <div className="app-container">
            <TiktokChat 
              chatMessages={chatMessages}
              
            />

             <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}            
            /> 
          </div>
        );
      }

      //generating HTML

      function ChatMessage({message, sender}) { //message: 'hello chatbot'
        //const message = props.message; //hello chatbot
        //const sender = props.sender; //user, robot

        //const {message, sender} = props;

       /* if (sender === 'robot') {
          return (
            <div>
            <img src="robot.png" width="50"/>
             {message} 
          </div>
          );
        }
        */
        return (
          <div className={
            sender === 'user' 
            ? 'chat-message-user' 
            : 'chat-message-robot'
          }>
           {sender === 'robot' && (
            <img src="robot.png" className="chat-message-profile"/>
          )}
          <div className="chat-message-text">
            {message} 
          </div>
           {sender === 'user' &&  (
            <img src="user.png" className="chat-message-profile"/>
          )}
          </div>
        );
      }



      //making it interactive

      function ChatInput({chatMessages, setChatMessages}) {
        const [inputText, setInputText] = React.useState('');

        function saveInputText(event) {
          setInputText(event.target.value); //the inputed of the user is hello
        }

        function sendMessage() {
          const newChatMessages = [
          ...chatMessages, //current array
          {
            message: inputText, //value that was set by the user 'hello'
            sender: 'user',
            id: crypto.randomUUID()//generates random id
          }
         ];

          setChatMessages(newChatMessages); //special function like chatMessages.push to an array

         const response = Chatbot.getResponse(inputText); //chatbot response of the user 'hello'
           setChatMessages([
          ...newChatMessages,
          {
            message: response,
            sender: 'robot',
            id: crypto.randomUUID()
          }
         ]);
          
         setInputText('');
        }

        return (
          <div className="chat-input-container">
            <input 
              placeholder="Send a message to ChatBot"
              size="30"
              onChange={saveInputText} //value hello
              value={inputText} //stores temporarily the saveInputText //the value is now hello
              className="chat-input"
            />
            <button 
              onClick={sendMessage} 
              className="send-button"
            >Send</button>
          </div>
        );
      }


      //Displays the list of chat messages
      function TiktokChat({chatMessages}) {
        const chatMessagesRef = React.useRef(null); //initial value null or empty
        //takes the html element the <div> and save it in the chatMessagesRef


        React.useEffect(() => {
          const containerElem = chatMessagesRef.current
         
          if (containerElem) {
            containerElem.scrollTop = containerElem.scrollHeight;
            //scrollTop how far should we scroll on the top, scrollHeight total height of the element
          }
        }, [chatMessages]);

        return (
        <div className="chat-messages-container"
        ref={chatMessagesRef}> 
          {chatMessages.map((mockMessage) => {
                return (
                  <ChatMessage 
                    message = {mockMessage.message}
                    sender = {mockMessage.sender}
                    key = {mockMessage.id}
                  />
                )
              })}
         </div>
        );

      }
    
    </script>
  </body>
</html>
